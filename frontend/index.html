
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" href="/favicon.ico?v=1781609591196" sizes="any" type="image/x-icon" />
      <link rel="shortcut icon" href="/favicon.ico?v=1781609591196" type="image/x-icon" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <script>
        (function () {
          var theme = 'system';
          try { theme = localStorage.getItem('crm-theme') || 'system'; } catch (e) {}
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'image';
          preload.href = dark ? '/genoma-logo2.png' : '/genoma-logo.png';
          document.head.appendChild(preload);
        })();
      </script>
      <title>Genoma CRM</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
