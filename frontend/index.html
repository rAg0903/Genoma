
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" href="/favicon.ico?v=1784122956346" sizes="any" type="image/x-icon" />
      <link rel="shortcut icon" href="/favicon.ico?v=1784122956346" type="image/x-icon" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <script>
        (function () {
          var theme = 'light';
          try { theme = localStorage.getItem('crm-theme') || 'light'; } catch (e) {}
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        })();
      </script>
      <script>
        (function () {
          if (!navigator.userAgent.includes('GenomaDesktop')) return;
          var keys = ['token','authToken','jwtToken','access_token','genoma_user_role','genoma_role_permissions','genoma_stock_submodule_permissions','genoma_listings_submodule_permissions','genoma_definicoes_submodule_permissions','genoma_perfil_permissions_by_id'];
          try {
            for (var i = 0; i < keys.length; i++) {
              localStorage.removeItem(keys[i]);
              sessionStorage.removeItem(keys[i]);
            }
          } catch (e) {}
        })();
      </script>
      <title>Genoma CRM</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
