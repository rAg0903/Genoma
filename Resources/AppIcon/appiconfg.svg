<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- GENOMA logo: 3×3 grid with diagonal connections -->
    <g fill="#1A1C1E" stroke="#1A1C1E" stroke-linecap="round" stroke-linejoin="round">
        <!-- Diagonal connectors -->
        <line x1="228" y1="108" x2="108" y2="228" stroke-width="20" />
        <polyline points="348,108 228,228 108,348" fill="none" stroke-width="20" />
        <line x1="348" y1="228" x2="228" y2="348" stroke-width="20" />

        <!-- Grid nodes -->
        <circle cx="108" cy="108" r="26" />
        <circle cx="228" cy="108" r="26" />
        <circle cx="348" cy="108" r="26" />
        <circle cx="108" cy="228" r="26" />
        <circle cx="228" cy="228" r="26" />
        <circle cx="348" cy="228" r="26" />
        <circle cx="108" cy="348" r="26" />
        <circle cx="228" cy="348" r="26" />
        <circle cx="348" cy="348" r="26" />
    </g>
</svg>
